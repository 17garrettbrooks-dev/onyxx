<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>ONYX</title>
		<style>
			/* Monospace font & centering adjustments */
			body, h1, input, title {
				font-family: 'Courier New', Courier, monospace;
			}
			.desc {
				text-align: center;
			}
		</style>
		<meta
			name="description"
			content="ONYX - search is below, have fun :3"
		/>
		<meta
			name="theme-color"
			media="(prefers-color-scheme: dark)"
			content="#434c5e"
		/>
		<meta name="googlebot" content="index, follow, snippet" />
		<link rel="shortcut icon" href="favicon.ico" />
		<link rel="stylesheet" href="index.css" />

		<script src="baremux/index.js"></script>
		<script src="uv/uv.bundle.js"></script>
		<script src="uv/uv.config.js"></script>
	</head>

	<body>
		<div
			title="ONYX Logo"
			class="flex-center logo-wrapper header-center"
		>
			<h1>ONYX</h1>
		</div>
		<div class="flex-center desc">
			<p>search is below, have fun :3</p>
		</div>

		<form id="uv-form" class="flex-center">
			<input
				id="uv-search-engine"
				value="https://www.google.com/search?q=%s"
				type="hidden"
			/>
			<input id="uv-address" type="text" placeholder="Search the web freely" />
		</form>
		<div class="desc" style="text-align: center;">
			<p id="uv-error"></p>
			<pre id="uv-error-code"></pre>
		</div>
		<iframe style="display: none" id="uv-frame"></iframe>
		<script src="register-sw.js"></script>
		<script src="search.js"></script>
		<script src="index.js"></script>
	</body>
</html>

<!-- Tab Cloak Controls -->

    <button onclick="cloakTab('Google Classroom', 'https://gstatic.com/classroom/ic_product_classroom_32.png')">Disguise as Classroom</button>
    <button onclick="cloakTab('ONYX', 'favicon.ico')">Reset</button>
